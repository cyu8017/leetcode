name: Sync LeetCode Problems

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan LeetCode and scaffold new folders
        shell: pwsh
        run: .\scripts\sync-new-problems.ps1

      - name: Sync test cases for new problems
        shell: pwsh
        run: |
          $report = Get-Content config\last-sync.json | ConvertFrom-Json
          foreach ($problem in $report.newProblems) {
            if ($problem.Number) {
              python scripts/sync-test-cases.py --number $problem.Number --force
            }
          }

      - name: Refresh test configs for new problems
        shell: pwsh
        run: |
          $report = Get-Content config\last-sync.json | ConvertFrom-Json
          foreach ($problem in $report.newProblems) {
            if ($problem.Number) {
              python scripts/sync-test-config.py --number $problem.Number --force
            }
          }

      - name: Validate repository
        shell: pwsh
        run: python scripts/validate-repo.py

      - name: Commit new problem folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: sync new LeetCode problem folders"
          git push
